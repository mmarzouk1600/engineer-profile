version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: str-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html/
    volumes:
      - ./src:/var/www/html/
    networks:
      - str-network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: str-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html/
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - str-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: str-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: str
      MYSQL_ROOT_PASSWORD: secret_root_password
      MYSQL_USER: str_user
      MYSQL_PASSWORD: secret_password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - str-network

  redis:
    image: redis:alpine
    container_name: str-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - str-network

networks:
  str-network:
    driver: bridge

volumes:
  dbdata:
    driver: local